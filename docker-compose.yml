version: '3.8'

services:

  mysql-db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: sentiment_db
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./backend/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql:ro

  backend:
    build: ./backend
    environment:
      - DB_HOST=mysql-db
      - DB_USER=root
      - DB_PASSWORD=rootpassword
      - DB_NAME=sentiment_db
      - PORT=5000
      - ML_API=http://ml-model:8001
    ports:
      - "5000:5000"
    depends_on:
      - mysql-db
      - ml-model

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

  ml-model:
    build: ./ml-model
    ports:
      - "8001:8001"

volumes:
  db_data: